# Stellis Health alpha on Fly.io. Secrets (API keys) are set with `fly secrets set`, never here.
app = 'stellis-health'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  STELLIS_HOST = '0.0.0.0'
  # Fly's proxy ends TLS and sends X-Forwarded-Proto; only it can reach the public port.
  STELLIS_FORWARDED_ALLOW_IPS = '*'
  STELLIS_DATA_DIR = '/data'
  STELLIS_SECURE_COOKIES = '1'
  STELLIS_SHARED_PROVIDER_KEYS = '1'
  # Legacy direct Token Factory mode. This deployment does not run NemoClaw.
  # The managed cloud launch is configured separately; see docs/launch.md.
  STELLIS_RUNTIME_PROFILE = 'direct'
  STELLIS_DAILY_TOKEN_LIMIT = '200000'

# SQLite files, recordings and speech models. One volume means one machine.
[mounts]
  source = 'stellis_data'
  destination = '/data'
  initial_size = '5gb'

[http_service]
  internal_port = 8080
  force_https = true
  # Transcription and agent jobs run in the background, so the machine stays up.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
