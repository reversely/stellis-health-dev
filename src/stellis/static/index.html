<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>Stellis</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17202b; background: #f6f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { height: 68px; display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid #e4e8ef; background: white; }
      .brand { font-size: 21px; font-weight: 750; letter-spacing: -.04em; color: #263a84; }
      main { max-width: 1040px; margin: 0 auto; padding: 52px 28px; }
      h1 { font-size: clamp(30px, 5vw, 46px); letter-spacing: -.05em; margin: 0 0 12px; }
      p { line-height: 1.55; color: #586273; margin: 0; }
      .empty { background: white; border: 1px solid #e4e8ef; border-radius: 18px; margin-top: 36px; min-height: 300px; display: grid; place-items: center; text-align: center; padding: 32px; }
      .empty strong { display: block; font-size: 19px; margin-bottom: 8px; }
      @media (max-width: 600px) { header { padding: 0 20px; } main { padding: 36px 20px; } }
    </style>
  </head>
  <body>
    <header><div class="brand">stellis</div></header>
    <main>
      <h1>Your conversations</h1>
      <p>Recordings, transcripts, and useful insights in one place.</p>
      <section class="empty" aria-label="Empty conversations">
        <div><strong>No conversations yet</strong><p>Your recordings will appear here.</p></div>
      </section>
    </main>
  </body>
</html>
